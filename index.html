  {"id": "086", "word": "secretary", "translation": "祕書", "category": "7. 特殊字尾與多音節字家族 (Suffixes & Multi-Syllables)", "subcategory": "-ary / -ery 字尾"},
  {"id": "193", "word": "actively", "translation": "積極地", "category": "7. 特殊字尾與多音節字家族 (Suffixes & Multi-Syllables)", "subcategory": "-ive / -ous 字尾"},
  {"id": "198", "word": "expensive", "translation": "昂貴的", "category": "7. 特殊字尾與多音節字家族 (Suffixes & Multi-Syllables)", "subcategory": "-ive / -ous 字尾"},
  {"id": "214", "word": "serious", "translation": "嚴重的；認真的", "category": "7. 特殊字尾與多音節字家族 (Suffixes & Multi-Syllables)", "subcategory": "-ive / -ous 字尾"},
  {"id": "172", "word": "beautiful", "translation": "美麗的", "category": "7. 特殊字尾與多音節字家族 (Suffixes & Multi-Syllables)", "subcategory": "多音節與其他字尾 (-ly, -al, -ing, -cean, -eau)"},
  {"id": "190", "word": "consistent", "translation": "一致的；前後一致的", "category": "7. 特殊字尾與多音節字家族 (Suffixes & Multi-Syllables)", "subcategory": "多音節與其他字尾 (-ly, -al, -ing, -cean, -eau)"},
  {"id": "153", "word": "copying", "translation": "抄寫；複製（進行式）", "category": "7. 特殊字尾與多音節字家族 (Suffixes & Multi-Syllables)", "subcategory": "多音節與其他字尾 (-ly, -al, -ing, -cean, -eau)"},
  {"id": "060", "word": "libraries", "translation": "圖書館（複數）", "category": "7. 特殊字尾與多音節字家族 (Suffixes & Multi-Syllables)", "subcategory": "多音節與其他字尾 (-ly, -al, -ing, -cean, -eau)"},
  {"id": "021", "word": "ocean", "translation": "海洋", "category": "7. 特殊字尾與多音節字家族 (Suffixes & Multi-Syllables)", "subcategory": "多音節與其他字尾 (-ly, -al, -ing, -cean, -eau)"},
  {"id": "142", "word": "tropical", "translation": "熱帶的", "category": "7. 特殊字尾與多音節字家族 (Suffixes & Multi-Syllables)", "subcategory": "多音節與其他字尾 (-ly, -al, -ing, -cean, -eau)"},
  {"id": "031", "word": "usual", "translation": "平常的", "category": "7. 特殊字尾與多音節字家族 (Suffixes & Multi-Syllables)", "subcategory": "多音節與其他字尾 (-ly, -al, -ing, -cean, -eau)"},
  {"id": "017", "word": "usually", "translation": "通常", "category": "7. 特殊字尾與多音節字家族 (Suffixes & Multi-Syllables)", "subcategory": "多音節與其他字尾 (-ly, -al, -ing, -cean, -eau)"}
];

        const { useState, useEffect } = React;

        function App() {
            const [currentIndex, setCurrentIndex] = useState(0);
            const [selectedCategory, setSelectedCategory] = useState("All");
            const [mode, setMode] = useState("Study");
            const [isWordRevealed, setIsWordRevealed] = useState(false);
            const audioRef = React.useRef(null);

            const categories = ["All", ...new Set(wordsData.map(item => item.category))];

            const filteredWords = selectedCategory === "All" 
                ? wordsData 
                : wordsData.filter(w => w.category === selectedCategory);

            useEffect(() => {
                setCurrentIndex(0);
            }, [selectedCategory]);

            useEffect(() => {
                setIsWordRevealed(false);
            }, [currentIndex, selectedCategory, mode]);

            const currentWord = filteredWords[currentIndex] || null;

            const speakWithSynthesis = (text) => {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'en-US';
                    utterance.rate = 0.85; // 稍微放慢語速適合小孩聽
                    window.speechSynthesis.speak(utterance);
                }
            };

            const stopPlayback = () => {
                if (audioRef.current) {
                    audioRef.current.pause();
                    audioRef.current.currentTime = 0;
                    audioRef.current = null;
                }

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
            };

            const speak = (text) => {
                stopPlayback();

                const audio = new Audio(
                    new URL(`./audio/${encodeURIComponent(text)}.mp3`, document.baseURI).href
                );
                audioRef.current = audio;

                const useFallback = () => {
                    if (audioRef.current !== audio) return;

                    audioRef.current = null;
                    speakWithSynthesis(text);
                };

                audio.addEventListener('error', useFallback, { once: true });
                audio.play().catch(useFallback);
            };

            useEffect(() => () => stopPlayback(), []);

            const nextCard = () => {
                setCurrentIndex((prev) => (prev + 1) % filteredWords.length);
            };

            const prevCard = () => {
                setCurrentIndex((prev) => (prev - 1 + filteredWords.length) % filteredWords.length);
            };

            const randomCard = () => {
                if (filteredWords.length === 0) return;

                setCurrentIndex((prev) => {
                    if (filteredWords.length === 1) return 0;

                    let randomIndex;
                    do {
                        randomIndex = Math.floor(Math.random() * filteredWords.length);
                    } while (randomIndex === prev);
                    return randomIndex;
                });
            };

            useEffect(() => {
                const handleKeyDown = (event) => {
                    const target = event.target;
                    if (target instanceof HTMLInputElement ||
                        target instanceof HTMLTextAreaElement ||
                        target instanceof HTMLSelectElement) {
                        return;
                    }

                    switch (event.key) {
                        case "ArrowRight":
                            event.preventDefault();
                            nextCard();
                            break;
                        case "ArrowLeft":
                            event.preventDefault();
                            prevCard();
                            break;
                        case " ":
                            event.preventDefault();
                            if (currentWord) speak(currentWord.word);
                            break;
                        case "Enter":
                            event.preventDefault();
                            randomCard();
                            break;
                        case "Backspace":
                            event.preventDefault();
                            setIsWordRevealed(true);
                            break;
                    }
                };

                window.addEventListener("keydown", handleKeyDown);
                return () => window.removeEventListener("keydown", handleKeyDown);
            }, [filteredWords, currentIndex]);

            if (!currentWord) return <div className="text-2xl font-bold p-8">Loading...</div>;

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4">
                    <h1 className="text-4xl md:text-5xl font-extrabold text-blue-600 mb-6 drop-shadow-md text-center">
                        🌟 2026 拼字大明星 🌟
                    </h1>
                    
                    <div className="mb-6 flex items-center gap-2 bg-white p-2 rounded-full shadow-lg border-2 border-gray-100">
                        <button
                            onClick={() => setMode("Study")}
                            className={`btn-press px-5 py-2 rounded-full font-black transition-colors ${
                                mode === "Study"
                                    ? "bg-blue-500 text-white"
                                    : "bg-gray-100 text-gray-600 hover:bg-gray-200"
                            }`}
                        >
                            Study
                        </button>
                        <button
                            onClick={() => setMode("Challenge")}
                            className={`btn-press px-5 py-2 rounded-full font-black transition-colors ${
                                mode === "Challenge"
                                    ? "bg-orange-500 text-white"
                                    : "bg-gray-100 text-gray-600 hover:bg-gray-200"
                            }`}
                        >
                            Challenge
                        </button>
                    </div>

                    <div className="mb-6 w-full max-w-md">
                        <label className="block text-sm font-bold text-gray-700 mb-2">選擇學習分類：</label>
                        <select 
                            className="w-full p-3 rounded-2xl border-4 border-blue-300 bg-white text-lg font-bold text-gray-700 shadow-sm focus:outline-none focus:border-blue-500 transition-colors"
                            value={selectedCategory}
                            onChange={(e) => setSelectedCategory(e.target.value)}
                        >
                            <option value="All">🌈 全部單字 (共 225 字)</option>
                            {categories.filter(c => c !== "All").map(cat => (
                                <option key={cat} value={cat}>{cat}</option>
                            ))}
                        </select>
                    </div>

                    <div className="card-container w-full max-w-2xl relative">
                        <div className="bg-white rounded-[2rem] shadow-2xl w-full p-8 relative overflow-hidden border-8 border-yellow-400 flex flex-col items-center">
                            
                            {/* 編號標籤 */}
                            <div className="absolute top-4 left-4 bg-yellow-200 text-yellow-800 px-4 py-1 rounded-full text-sm font-black shadow-sm">
                                #{currentWord.id}
                            </div>
                            
                            {/* 分類標籤 */}
                            <div className="mt-8 mb-2 text-center w-full">
                                <p className="text-sm font-black text-blue-500 mb-2">{currentWord.category}</p>
                                <p className="text-xs font-bold text-gray-600 bg-gray-100 inline-block px-4 py-1.5 rounded-full shadow-inner">
                                    {currentWord.subcategory}
                                </p>
                            </div>

                            {/* 英文單字 */}
                            <h2 className="text-6xl md:text-7xl font-black text-gray-800 my-6 tracking-wide drop-shadow-sm text-center w-full break-words">
                                {mode === "Study" || isWordRevealed ? (
                                    currentWord.word
                                ) : (
                                    <button
                                        onClick={() => setIsWordRevealed(true)}
                                        className="btn-press min-w-28 h-24 rounded-3xl bg-orange-500 hover:bg-orange-600 text-white text-6xl font-black shadow-lg border-4 border-orange-300 transition-transform"
                                        title="顯示單字"
                                        aria-label="顯示單字"
                                    >
                                        ?
                                    </button>
                                )}
                            </h2>
                            
                            {/* 發音按鈕 */}
                            <button 
                                onClick={() => speak(currentWord.word)}
                                className="btn-press bg-blue-500 hover:bg-blue-600 text-white p-5 rounded-full shadow-lg transition-transform mb-6 flex items-center justify-center border-4 border-blue-400"
                            >
                                <i data-lucide="volume-2" className="w-10 h-10"></i>
                            </button>

                            {/* 中文翻譯 */}
                            <div className="w-full bg-green-100 rounded-3xl p-5 text-center border-4 border-green-300 shadow-inner">
                                <p className="text-3xl font-black text-green-700">{currentWord.translation}</p>
                            </div>
                        </div>
                    </div>

                    {/* 控制按鈕 */}
                    <div className="flex gap-4 mt-8 w-full max-w-md justify-between items-center bg-white p-3 rounded-full shadow-lg border-2 border-gray-100">
                        <button 
                            onClick={prevCard}
                            className="btn-press flex items-center justify-center bg-gray-100 text-gray-700 w-14 h-14 rounded-full font-bold shadow-sm hover:bg-gray-200 transition-colors"
                        >
                            <i data-lucide="chevron-left" className="w-8 h-8"></i>
                        </button>
                        <span className="text-xl font-black text-gray-600 bg-gray-50 px-6 py-2 rounded-full">
                            {currentIndex + 1} / {filteredWords.length}
                        </span>
                        <div className="flex gap-2">
                            <button 
                                onClick={nextCard}
                                className="btn-press flex items-center justify-center bg-blue-500 text-white w-14 h-14 rounded-full font-bold shadow-sm hover:bg-blue-600 transition-colors"
                            >
                                <i data-lucide="chevron-right" className="w-8 h-8"></i>
                            </button>
                            <button 
                                onClick={randomCard}
                                className="btn-press flex items-center justify-center bg-purple-500 text-white w-14 h-14 rounded-full font-bold shadow-sm hover:bg-purple-600 transition-colors"
                            >
                                <i data-lucide="shuffle" className="w-8 h-8"></i>
                            </button>
                        </div>
                    </div>
                    <p className="mt-4 text-sm font-bold text-gray-500 text-center">
                        鍵盤：← 上一個　→ 下一個　空白鍵 發音　Enter 隨機單字
                    </p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // 初始化圖示
        setTimeout(() => { lucide.createIcons(); }, 100);
    </script>
</body>
</html>
